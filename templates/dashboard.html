<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <!-- Bootstrap (direct access) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #dde5f0, #f2f6fb);
    }

    .card-custom {
      width: 420px;
      border-radius: 15px;
      padding: 30px;
    }

    /* Welcome + username */
    .welcome-text {
      font-size: 26px;
      font-weight: 700;
    }

    
    /* Gradient username */
    .username-gradient {
      background: linear-gradient(to right, #8e2de2, #ff4ecd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    /* Role badge */
    .role-badge {
      background: #f1f1f1;
      color: #556;
      font-size: 15px;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block; 
    }
  </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card card-custom shadow-lg border-0 text-center">

    <!-- Welcome + Username -->
    <div class="welcome-text mb-3">
      Welcome, <span class="username-gradient">{{ user["username"] }}</span> 
    </div>

    <!-- Role -->
    <div class="role-badge mb-4">
      {{ user["role"] }}
    </div>

    <!-- Logout -->
    <a href="/logout" class="btn btn-dark w-100">
      Logout
    </a>

  </div>

</div>

</body>
</html>
