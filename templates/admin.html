<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #dde5f0, #f2f6fb);
      min-height: 100vh;
    }
    .card-custom {
      width: 600px;
      border-radius: 15px;
      padding: 30px;
      background: white;
    }
    .panel-title {
      font-size: 22px;
      font-weight: 700;
      color: #3C3489;
    }
    .welcome-msg {
      font-size: 13px;
      color: #666;
      background: #EEEDFE;
      border-radius: 10px;
      padding: 10px 15px;
      border: 1px solid #c5c2f5;
    }
    .table thead {
      background: #534AB7;
      color: white;
    }
    .table thead th {
      font-weight: 500;
      font-size: 14px;
    }
    .table tbody td {
      font-size: 13px;
      color: #444;
      vertical-align: middle;
    }
    .back-btn {
      color: #534AB7;
      border: 1px solid #534AB7;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s;
    }
    .back-btn:hover {
      background: #EEEDFE;
      color: #3C3489;
    }
  </style>
</head>
<body>
<!-- Admin only page - access controlled by Flask route -->
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card-custom shadow-lg border-0 text-center">
    <div class="panel-title mb-1"> Admin Control Panel</div>
    <div class="text-muted small mb-4" style="font-size: 12px;">Secure Area</div>
    <div class="welcome-msg mb-4 text-center">
    Only admin users can access this page
</div>
    <h6 class="text-start fw-bold mb-3" style="color: #444;">Registered Users</h6>
    <!-- Loop through all registered users passed from Flask -->
    <table class="table table-bordered table-hover mb-4">
      <thead>
        <tr>
          <th>#</th>
          <th>Username</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u["id"] }}</td>
          <td>{{ u["username"] }}</td>
          <td>
            <!-- Badge color differs by role: blue for admin, grey for user -->
            {% if u["role"] == "admin" %}
              <span class="badge bg-primary">admin</span>
            {% else %}
              <span class="badge bg-secondary">user</span>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>
</div>
</body>
</html>
