<!DOCTYPE html>
<html>
<head>
  <title>Comments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #dde5f0, #f2f6fb);
      min-height: 100vh;
    }
    .card-custom {
      width: 480px;
      border-radius: 15px;
      padding: 30px;
      background: white;
    }
    .comment-item {
      font-size: 13px;
      padding: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card-custom shadow-lg border-0">
    <h5 class="fw-bold mb-4" style="color:#3C3489;">💬 Comments </h5>
    <form method="POST" class="mb-4">
      <div class="input-group">
        <input name="comment" class="form-control form-control-sm" placeholder="Write a comment">
        <button class="btn btn-dark btn-sm" type="submit">Add Comment</button>
      </div>
    </form>
    <hr>
    <ul class="list-unstyled">
      {% for c in comments %}
        <li class="comment-item">
          <span style="font-size:12px; font-weight:600; color:#534AB7;">{{ c["username"] }}</span>
          <!-- vulnerable to xss -->
          <span class="text-muted"> {{ c["text"]|safe }}</span>
          <!-- fixed version -->
          <!-- <span class="text-muted"> {{ c["text"] }}</span> -->
        </li>
      {% endfor %}
    </ul>
    <div class="mt-3">
      <a href="/dashboard" class="text-decoration-none small fw-bold px-4 py-2" style="color:#534AB7; border:1px solid #534AB7; border-radius:20px;">
        ← Back to Dashboard
      </a>
    </div>
  </div>
</div>
</body>
</html>
